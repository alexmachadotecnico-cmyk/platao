<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tutor Socrático — A Alegoria da Caverna</title>
  <!-- Paho MQTT para sincronização global em tempo real -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    :root {
      --bg-dark: #070a12;
      --bg-card: #0f1626;
      --bg-input: #172033;
      --border: #1e293b;
      --gold: #f59e0b;
      --gold-light: #fef08a;
      --gold-dark: #b45309;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --emerald: #10b981;
      --cyan: #06b6d4;
      --fire: #f97316;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header {
      background: rgba(15, 22, 38, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-header {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #070a12;
      font-weight: 800;
    }

    .header-title h1 {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }

    .header-title p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stage-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold-light);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* Modal Inicial de Identificação */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(7, 10, 18, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--gold);
      border-radius: 18px;
      padding: 26px 20px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .modal-icon { font-size: 40px; }

    .modal-box h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--gold-light);
    }

    .modal-box p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .input-name {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      text-align: center;
    }

    .input-name:focus { border-color: var(--gold); }

    .btn-start {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #070a12;
      font-weight: 800;
      font-size: 15px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* Área de Chat */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 120px;
    }

    .message-row {
      display: flex;
      gap: 10px;
      max-width: 88%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.tutor { align-self: flex-start; }
    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .msg-avatar.tutor {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #070a12;
    }

    .msg-avatar.user {
      background: #334155;
      color: white;
    }

    .msg-bubble {
      padding: 12px 15px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .message-row.tutor .msg-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      border-left: 3px solid var(--gold);
    }

    .message-row.user .msg-bubble {
      background: #1e3a8a;
      border: 1px solid #2563eb;
      border-top-right-radius: 4px;
    }

    .alert-scaffold {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--gold-light);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Pílulas de Sugestão Rápida */
    .quick-chips {
      position: fixed;
      bottom: 64px;
      left: 0; right: 0;
      background: rgba(7, 10, 18, 0.95);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 40;
    }

    .chip-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 11.5px;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip-btn:active { background: #334155; }
    .chip-btn.danger { border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }

    /* Barra de Digitação Fixa no Rodapé */
    .input-bar {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      z-index: 50;
    }

    .chat-text-input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .chat-text-input:focus { border-color: var(--gold); }

    .btn-send-chat {
      background: var(--gold);
      color: #070a12;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Modal Inicial -->
  <div class="modal-overlay" id="nameModal">
    <div class="modal-box">
      <div class="modal-icon">🏛️</div>
      <h2>Entrar na Caverna de Platão</h2>
      <p>Você terá um diálogo socrático individual com o tutor de IA, sendo provocado a sair das sombras em direção à luz.</p>
      <input type="text" class="input-name" id="studentNameInput" placeholder="Seu nome ou pseudônimo...">
      <button class="btn-start" onclick="startSession()">Começar o Diálogo</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="avatar-header">Σ</div>
      <div class="header-title">
        <h1 id="headerStudentName">Sócrates (Tutor IA)</h1>
        <p>Alegoria da Caverna &middot; Rep. VII</p>
      </div>
    </div>
    <div class="stage-badge" id="stageBadge">Fase 1: As Sombras</div>
  </header>

  <!-- Área de Mensagens -->
  <div class="chat-container" id="chatContainer">
    <!-- Inserido dinamicamente -->
  </div>

  <!-- Sugestões Rápidas de Resposta -->
  <div class="quick-chips" id="quickChips">
    <button class="chip-btn" onclick="sendQuickText('As sombras são como as redes sociais e aparências da vida')">💭 "Sombras = aparências"</button>
    <button class="chip-btn" onclick="sendQuickText('Eles acreditam porque nunca viram nada além daquilo')">💭 "Nunca viram o real"</button>
    <button class="chip-btn danger" onclick="sendQuickText('Qual é a moral da história? Me dá o resumo pronto')">🚫 Pedir Resumo Pronto</button>
  </div>

  <!-- Barra de Digitação -->
  <div class="input-bar">
    <input type="text" class="chat-text-input" id="chatInput" placeholder="Responda a Sócrates..." onkeydown="if(event.key==='Enter') sendUserMessage()">
    <button class="btn-send-chat" onclick="sendUserMessage()">Enviar</button>
  </div>

  <script>
    const MQTT_TOPIC = "alexmachado_socrates_caverna_2026/feed";
    let studentName = "Estudante";
    let studentId = "std_" + Math.random().toString(16).substring(2, 9);
    let currentStage = 1; // 1: Sombras, 2: Subida/Fogo, 3: O Sol
    let mqttClient = null;
    const channel = new BroadcastChannel('socrates_caverna_live');

    function initMqtt() {
      if (typeof Paho === 'undefined') return;
      const cid = "mob_" + Math.random().toString(16).substring(2, 10);
      mqttClient = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), "/mqtt", cid);
      mqttClient.connect({
        useSSL: true,
        timeout: 5,
        onSuccess: () => console.log("MQTT conectado no celular!"),
        onFailure: (e) => console.warn("MQTT erro no celular:", e)
      });
    }

    function startSession() {
      const input = document.getElementById('studentNameInput').value.trim();
      if (!input) {
        alert('Por favor, digite seu nome ou pseudônimo.');
        return;
      }
      studentName = input;
      document.getElementById('nameModal').style.display = 'none';
      document.getElementById('headerStudentName').textContent = `Diálogo com ${studentName}`;

      // Envia evento inicial para o telão
      broadcastToProjection("", 1);

      // Mensagem de abertura de Sócrates
      appendTutorMessage(
        `Saudações, <strong>${escapeHtml(studentName)}</strong>! Imagine prisioneiros que vivem desde a infância acorrentados no fundo de uma caverna escura, sem poder mover a cabeça. Atrás deles queima uma fogueira, e entre eles e o fogo passam pessoas segurando estátuas e objetos que projetam sombras na parede da frente.<br><br>` +
        `Se esses homens <strong>nunca viram outra coisa em toda a existência</strong>, me diga: o que eles considerariam como a <em>verdadeira realidade</em>?`
      );
    }

    function appendTutorMessage(html, hasScaffold = false) {
      const container = document.getElementById('chatContainer');
      const row = document.createElement('div');
      row.className = 'message-row tutor';
      row.innerHTML = `
        <div class="msg-avatar tutor">Σ</div>
        <div class="msg-bubble">
          ${html}
          ${hasScaffold ? '<div class="alert-scaffold">🔒 <strong>Mediação Ativa:</strong> O tutor socrático não entrega a resposta pronta para estimular seu raciocínio crítico.</div>' : ''}
        </div>
      `;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function appendUserMessage(text) {
      const container = document.getElementById('chatContainer');
      const row = document.createElement('div');
      row.className = 'message-row user';
      row.innerHTML = `
        <div class="msg-avatar user">Eu</div>
        <div class="msg-bubble">${escapeHtml(text)}</div>
      `;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function sendQuickText(text) {
      document.getElementById('chatInput').value = text;
      sendUserMessage();
    }

    function sendUserMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      appendUserMessage(text);
      input.value = '';

      processSocraticLogic(text);
    }

    function processSocraticLogic(text) {
      const lower = text.toLowerCase();

      setTimeout(() => {
        // Tentativa de pedir resposta pronta
        if (lower.includes('resumo') || lower.includes('moral da história') || lower.includes('resposta pronta') || lower.includes('me dá a resposta') || lower.includes('o que significa')) {
          appendTutorMessage(
            `Ah, meu caro! Se eu lhe entregar um resumo pronto de Platão, estarei apenas projetando <strong>mais uma sombra na sua parede</strong>! 💡<br><br>` +
            `O papel do filósofo não é decorar respostas, mas parir o próprio saber. Olhe para a caverna: <strong>o que na sua própria vida diária funciona exatamente como as sombras e os ecos da parede?</strong>`,
            true
          );
          return;
        }

        // Lógica FASE 1 -> FASE 2
        if (currentStage === 1) {
          if (lower.includes('aparência') || lower.includes('ilusão') || lower.includes('rede social') || lower.includes('opinião') || lower.includes('verdade') || lower.includes('sombra') || lower.includes('senso comum') || lower.includes('fake') || lower.includes('sentidos')) {
            currentStage = 2;
            updateStageUI('Fase 2: O Fogo e a Subida');
            broadcastToProjection(text, 2);

            // Atualiza chips de sugestão
            updateChipsStage2();

            appendTutorMessage(
              `Brilhante reflexão, ${escapeHtml(studentName)}! Você acaba de quebrar o primeiro grilhão: reconhecer que aquilo que a maioria chama de "realidade" são apenas imagens de segunda mão (a <em>Doxa</em> ou opinião).<br><br>` +
              `Agora, imagine que alguém solta um desses homens à força e o obriga a levantar, virar o pescoço e olhar direto para o fogo. <strong>O que acontece com os olhos dele? E se tentarem arrastá-lo para fora da caverna em direção ao sol, ele vai achar a subida agradável ou dolorosa?</strong>`
            );
          } else {
            appendTutorMessage(
              `Muito interessante. Mas perceba: eles não sabem que estão numa caverna. Para eles, aquele eco e aquelas sombras são tudo o que existe. Se você mostrasse a eles o mundo lá fora de repente, você acha que eles acreditariam em você ou achariam que você ficou louco?`
            );
          }
        } 
        // Lógica FASE 2 -> FASE 3
        else if (currentStage === 2) {
          if (lower.includes('dor') || lower.includes('machuca') || lower.includes('cega') || lower.includes('difícil') || lower.includes('desconfort') || lower.includes('luz') || lower.includes('resist') || lower.includes('tempo') || lower.includes('sol')) {
            currentStage = 3;
            updateStageUI('Fase 3: A Luz do Sol');
            broadcastToProjection(text, 3);

            updateChipsStage3();

            appendTutorMessage(
              `Precisamente! A luz da verdade dói aos olhos acostumados à penumbra. Conhecer a essência exige esforço e causa desconforto.<br><br>` +
              `O prisioneiro liberto finalmente sai da caverna e contempla o <strong>Sol</strong> — que para Platão representa a <em>Ideia do Bem</em>, fonte de toda inteligência e vida.<br><br>` +
              `E aqui está a pergunta crucial: <strong>Depois de contemplar o Sol, o filósofo deve permanecer isolado no topo da montanha desfrutando da verdade, ou ele tem a obrigação ética de descer de volta à caverna para ajudar a libertar seus antigos companheiros?</strong>`
            );
          } else {
            appendTutorMessage(
              `Pense na sensação física: quem passa a vida inteira no escuro e é forçado a olhar para a luz sente alívio imediato ou dor nos olhos? Por que romper com as velhas certezas causa tanto incômodo no ser humano?`
            );
          }
        }
        // Lógica FASE 3 (Conclusão)
        else if (currentStage === 3) {
          broadcastToProjection(text, 3);
          appendTutorMessage(
            `🎉 <strong>Você atingiu o cume da Alegoria da Caverna!</strong><br><br>` +
            `Platão afirma que o filósofo tem sim o dever cívico de descer de volta à escuridão da caverna (a <em>katábasis</em>), mesmo correndo o risco de ser ridicularizado e até morto — como de fato aconteceu com o próprio Sócrates em Atenas.<br><br>` +
            `A educação não é passividade nem acúmulo de dados: é a coragem de virar a alma inteira das sombras para a luz. Parabéns pelo seu percurso reflexivo!`
          );
        }
      }, 700);
    }

    function updateStageUI(title) {
      document.getElementById('stageBadge').textContent = title;
    }

    function updateChipsStage2() {
      const c = document.getElementById('quickChips');
      c.innerHTML = `
        <button class="chip-btn" onclick="sendQuickText('A luz machuca os olhos e causa dor porque é desconfortável')">💭 "A luz machuca os olhos"</button>
        <button class="chip-btn" onclick="sendQuickText('Ele resistiria e tentaria voltar para a segurança das sombras')">💭 "Ele tentaria voltar"</button>
        <button class="chip-btn danger" onclick="sendQuickText('Me dá o resumo pronto')">🚫 Resumo Pronto</button>
      `;
    }

    function updateChipsStage3() {
      const c = document.getElementById('quickChips');
      c.innerHTML = `
        <button class="chip-btn" onclick="sendQuickText('Ele tem o dever moral de voltar para tentar libertar os outros')">💭 "Dever moral de retornar"</button>
        <button class="chip-btn" onclick="sendQuickText('Se ele voltar, os outros vão achar que ele está louco')">💭 "Eles vão zombar dele"</button>
      `;
    }

    function broadcastToProjection(insight, stage) {
      const payload = {
        id: studentId,
        nome: studentName,
        stage: stage,
        insight: insight,
        time: new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })
      };

      // 1. MQTT
      if (mqttClient && mqttClient.isConnected()) {
        try {
          const msg = new Paho.MQTT.Message(JSON.stringify(payload));
          msg.destinationName = MQTT_TOPIC;
          mqttClient.send(msg);
        } catch (e) {}
      }

      // 2. BroadcastChannel Local
      try {
        channel.postMessage({ type: 'CAVERNA_EVENT', payload: payload });
      } catch (e) {}

      // 3. LocalStorage
      try {
        localStorage.setItem('caverna_last_item', JSON.stringify(payload));
        localStorage.setItem('caverna_trigger', Date.now());
      } catch (e) {}
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    window.onload = () => {
      initMqtt();
    };
  </script>

</body>
</html>
