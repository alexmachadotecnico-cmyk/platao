<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Platão AI — Diálogo Socrático</title>
  <!-- Paho MQTT para sincronização global via WebSockets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.35);
      --cyan: #06b6d4;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.3);
      --fire: #f97316;
      --fire-glow: rgba(249, 115, 22, 0.3);
      --rose: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Canvas Confetti no topo */
    #confettiCanvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* Ambient Glow Mobile */
    .mobile-glow {
      position: fixed;
      top: -100px;
      right: -100px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Top Bar Glassmorphism */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 15, 30, 0.82);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .header-titles h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .header-titles p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .badge-stage {
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.15);
      color: #fde68a;
      border: 1px solid rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.15);
      transition: all 0.3s;
    }

    /* Modal de Boas-Vindas */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .modal-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 24px;
      padding: 30px 22px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalPop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-card h2 {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff, #fde68a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .name-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      text-align: center;
      font-family: inherit;
      transition: all 0.2s;
    }

    .name-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .btn-enter {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #070a12;
      font-weight: 800;
      font-size: 15px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 0 25px var(--gold-glow);
      transition: transform 0.2s;
    }

    .btn-enter:active { transform: scale(0.97); }

    /* Chat Stream */
    .chat-stream {
      position: relative;
      z-index: 10;
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 95px;
    }

    .bubble-row {
      display: flex;
      gap: 10px;
      max-width: 90%;
      animation: bubbleSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes bubbleSlide {
      from { transform: translateY(10px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .bubble-row.tutor { align-self: flex-start; }
    .bubble-row.user { align-self: flex-end; flex-direction: row-reverse; }

    .bubble-avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .bubble-avatar.tutor {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #070a12;
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .bubble-avatar.user {
      background: #334155;
      color: white;
    }

    .bubble-content {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.55;
      position: relative;
    }

    .bubble-row.tutor .bubble-content {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(14px);
      border-top-left-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .bubble-row.user .bubble-content {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    /* Badges de Feedback Pedagógico no Chat */
    .eval-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.4px;
    }

    .eval-pill.insight {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      box-shadow: 0 0 10px var(--emerald-glow);
    }

    .eval-pill.refine {
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
      border: 1px solid rgba(249, 115, 22, 0.35);
      box-shadow: 0 0 10px var(--fire-glow);
    }

    .eval-pill.alert {
      background: rgba(244, 63, 94, 0.15);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.35);
    }

    /* Indicador de Digitação Pulsante */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-left: 44px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .wave-dots {
      display: flex;
      gap: 4px;
    }

    .w-dot {
      width: 6px;
      height: 6px;
      background: var(--gold);
      border-radius: 50%;
      animation: waveBounce 1.2s infinite ease-in-out;
    }
    .w-dot:nth-child(2) { animation-delay: 0.2s; }
    .w-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes waveBounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* Input Bar Futurista Glassmorphism */
    .input-dock {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(24px);
      border-top: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      z-index: 50;
    }

    .text-box {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 13px 18px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      font-family: inherit;
      transition: all 0.25s;
    }

    .text-box:focus {
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .btn-send {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #070a12;
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--gold-glow);
      transition: transform 0.15s;
    }

    .btn-send:active { transform: scale(0.94); }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>
  <div class="mobile-glow"></div>

  <!-- Modal Inicial -->
  <div class="modal-overlay" id="nameModal">
    <div class="modal-card">
      <div style="font-size: 42px;">🏛️</div>
      <h2>Entrar na Caverna de Platão</h2>
      <p>Você terá um diálogo socrático individual com Platão. Suas teses serão avaliadas em tempo real e projetadas na aula.</p>
      <input type="text" class="name-input" id="studentNameInput" placeholder="Seu nome ou pseudônimo...">
      <button class="btn-enter" onclick="startSession()">Entrar no Diálogo</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="header-info">
      <div class="avatar-icon">🏛️</div>
      <div class="header-titles">
        <h1 id="headerStudentName">Platão (Tutor AI)</h1>
        <p>Alegoria da Caverna &middot; Rep. VII</p>
      </div>
    </div>
    <div class="badge-stage" id="stageBadge">Fase 1: Sombras</div>
  </header>

  <!-- Chat Stream -->
  <div class="chat-stream" id="chatStream">
    <!-- Mensagens dinâmicas -->
  </div>

  <!-- Typing Indicator -->
  <div class="typing-indicator" id="typingIndicator">
    <div class="wave-dots">
      <div class="w-dot"></div>
      <div class="w-dot"></div>
      <div class="w-dot"></div>
    </div>
    <span>Platão avalia sua tese...</span>
  </div>

  <!-- Input Dock -->
  <div class="input-dock">
    <input type="text" class="text-box" id="chatInput" placeholder="Escreva seu raciocínio para Platão..." onkeydown="if(event.key==='Enter') sendUserMessage()">
    <button class="btn-send" onclick="sendUserMessage()">Enviar</button>
  </div>

  <script>
    const MQTT_TOPIC = "alexmachado_platao_caverna_2026/feed";
    let studentName = "Estudante";
    let studentId = "std_" + Math.random().toString(16).substring(2, 9);
    let currentStage = 1;
    let mqttClient = null;
    const channel = new BroadcastChannel('platao_caverna_live');

    function initMqtt() {
      if (typeof Paho === 'undefined') return;
      const cid = "mob_" + Math.random().toString(16).substring(2, 10);
      mqttClient = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), "/mqtt", cid);
      mqttClient.connect({
        useSSL: true,
        timeout: 5,
        onSuccess: () => console.log("MQTT conectado no celular!"),
        onFailure: (e) => console.warn("MQTT erro no celular:", e)
      });
    }

    function startSession() {
      const input = document.getElementById('studentNameInput').value.trim();
      if (!input) {
        alert('Por favor, digite seu nome ou pseudônimo.');
        return;
      }
      studentName = input;
      document.getElementById('nameModal').style.display = 'none';
      document.getElementById('headerStudentName').textContent = `Diálogo com ${studentName}`;

      broadcastToProjection("", 1);

      setTimeout(() => {
        appendTutorMessage(
          `Saudações, <strong>${escapeHtml(studentName)}</strong>!<br><br>` +
          `Imagine prisioneiros que vivem desde a infância encadeados no fundo de uma caverna escura, imobilizados pelo pescoço e pernas, de modo a contemplarem unicamente a parede de rocha à sua frente. Atrás deles queima uma fogueira, e entre eles e o fogo passam homens erguendo estátuas de madeira e pedra que projetam sombras na parede.<br><br>` +
          `Se esses prisioneiros <strong>nunca viram ou experimentaram nada além disso durante toda a vida</strong>, me diga com suas próprias palavras: o que eles considerariam como a <em>verdadeira realidade</em>?`
        );
      }, 350);
    }

    function appendTutorMessage(html, badgeType = null, badgeText = null) {
      const container = document.getElementById('chatStream');
      const row = document.createElement('div');
      row.className = 'bubble-row tutor';
      
      let badgeHtml = '';
      if (badgeType && badgeText) {
        badgeHtml = `<div class="eval-pill ${badgeType}">${badgeText}</div>`;
      }

      row.innerHTML = `
        <div class="bubble-avatar tutor">Π</div>
        <div class="bubble-content">
          ${badgeHtml}
          ${html}
        </div>
      `;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function appendUserMessage(text) {
      const container = document.getElementById('chatStream');
      const row = document.createElement('div');
      row.className = 'bubble-row user';
      row.innerHTML = `
        <div class="bubble-avatar user">Eu</div>
        <div class="bubble-content">${escapeHtml(text)}</div>
      `;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function showTyping(callback) {
      const indicator = document.getElementById('typingIndicator');
      indicator.style.display = 'flex';
      const container = document.getElementById('chatStream');
      container.scrollTop = container.scrollHeight;

      setTimeout(() => {
        indicator.style.display = 'none';
        callback();
      }, 950);
    }

    function sendUserMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      appendUserMessage(text);
      input.value = '';

      showTyping(() => {
        evaluateAndRespond(text);
      });
    }

    // MOTOR DE AVALIAÇÃO PEDAGÓGICA (HARVARD MODEL)
    function evaluateAndRespond(text) {
      const lower = text.toLowerCase();

      // Tentativa de atalhos e pedidos de respostas prontas
      if (lower.includes('resumo') || lower.includes('moral da história') || lower.includes('resposta pronta') || lower.includes('me dá a resposta') || lower.includes('o que significa') || lower.includes('explica logo') || lower.includes('gabarito')) {
        appendTutorMessage(
          `Ah, meu caro <strong>${escapeHtml(studentName)}</strong>! Se eu lhe entregar um resumo pronto ou uma fórmula de Platão, estarei agindo exatamente como aqueles homens que manipulam estátuas: projetando mais uma sombra sobre você! 💡<br><br>` +
          `A filosofia exige o exame de si mesmo. Diga-me: <strong>o que na sua própria realidade cotidiana funciona exatamente como as sombras e os ecos da parede da caverna?</strong>`,
          'alert', '🔒 Atalho Bloqueado'
        );
        return;
      }

      // FASE 1: AS SOMBRAS NO FUNDO DA CAVERNA (DOXA)
      if (currentStage === 1) {
        if (lower.includes('burro') || lower.includes('idiota') || lower.includes('tolo') || lower.includes('ignorante') && !lower.includes('estrutura')) {
          appendTutorMessage(
            `Cuidado com essa conclusão precipitada! Os homens da caverna estão acorrentados <em>desde a infância</em>, sem qualquer alternativa. Eles não são tolos; são reféns de uma estrutura que moldou sua percepção.<br><br>` +
            `Pense bem: se alguém nunca teve acesso a outro mundo além de uma tela desde o nascimento, como poderia desconfiar dela? <strong>Tente reformular: por que a mente humana tende a aceitar as aparências sem suspeitar de nada?</strong>`,
            'refine', '⚠️ Ponto a Refinar'
          );
          return;
        }

        if (lower.includes('desconfia') || lower.includes('sabem que é falso') || lower.includes('duvidar')) {
          appendTutorMessage(
            `Reflita com rigor ontológico: com base em quê eles desconfiariam? Se você nunca viu o objeto real, nem a fogueira, nem a si mesmo, a sombra não parece uma cópia; <strong>ela é o único original que existe</strong>.<br><br>` +
            `Como é possível duvidar de algo quando não se tem nenhum padrão de comparação? Tente responder novamente considerando esse limite dos sentidos.`,
            'refine', '⚠️ Equívoco Epistemológico'
          );
          return;
        }

        if (text.length < 10) {
          appendTutorMessage(
            `Sua resposta foi muito breve para a gravidade do tema! Diga-me com mais detalhes: <strong>o que na nossa sociedade contemporânea desempenha exatamente o papel dessas sombras na parede?</strong>`,
            'refine', '💬 Aprofunde seu Argumento'
          );
          return;
        }

        // Resposta Correta: Avança para Fase 2
        currentStage = 2;
        updateStageUI('Fase 2: O Fogo e a Subida');
        broadcastToProjection(text, 2);

        appendTutorMessage(
          `<strong>Perfeita compreensão!</strong> Você tocou no coração do conceito platônico de <em>Doxa</em> (opinião acrítica): para quem está encadeado aos sentidos, as aparências e narrativas são tomadas como a verdade absoluta.<br><br>` +
          `Agora, façamos a transição: imagine que alguém quebra os grilhões desse prisioneiro e o força bruscamente a se levantar, virar o pescoço e olhar diretamente para a chama ardente da fogueira.<br><br>` +
          `<strong>Como os olhos dele reagem à luz do fogo após uma vida inteira nas trevas? Por que o rompimento com as velhas certezas causa tanto incômodo e sofrimento ao ser humano?</strong>`,
          'insight', '✓ Tese Validada com Distinção'
        );
      }

      // FASE 2: O FOGO E A SUBIDA ÍNGREME
      else if (currentStage === 2) {
        if (lower.includes('feliz') || lower.includes('alegre') || lower.includes('alívio') || lower.includes('agradece')) {
          appendTutorMessage(
            `Será mesmo? Imagine alguém que passou 20 anos na escuridão absoluta sendo forçado a encarar uma labareda de fogo ardente. O corpo não agradece: os olhos ardem, a visão fica embaçada e o primeiro impulso é <strong>voltar correndo para a segurança da sombra</strong>!<br><br>` +
            `Por que o processo de aprender e questionar nossas crenças mais íntimas gera tanta resistência e dor psicológica? Tente aprofundar essa contradição.`,
            'refine', '⚠️ Ponto Cego Psicológico'
          );
          return;
        }

        if (text.length < 10) {
          appendTutorMessage(
            `Dê um passo além: não se limite a dizer que dói. <strong>Por que abandonar uma mentira confortável é mais difícil do que continuar nela?</strong>`,
            'refine', '💬 Aprofunde a Reflexão'
          );
          return;
        }

        // Resposta Correta: Avança para Fase 3
        currentStage = 3;
        updateStageUI('Fase 3: A Luz do Sol');
        broadcastToProjection(text, 3);
        triggerConfetti();

        appendTutorMessage(
          `<strong>Raciocínio primoroso!</strong> Você compreendeu que a filosofia não é um passeio suave, mas uma ruptura dolorosa. A luz cega temporariamente; a desconstrução das ilusões causa o que hoje chamamos de dissonância cognitiva.<br><br>` +
          `O prisioneiro é arrastado pela subida íngreme para fora da caverna. Pouco a pouco, seus olhos se habituam e ele contempla o próprio <strong>Sol</strong> — que para Platão representa a <em>Ideia do Bem</em>, causa de toda a inteligibilidade e verdade.<br><br>` +
          `Agora chegamos à questão ética e política definitiva da <em>República</em>: <strong>Após contemplar a verdade suprema sob o sol, o filósofo deve viver isolado desfrutando da luz, ou tem a obrigação moral de descer de volta à escuridão da caverna para tentar libertar os outros prisioneiros?</strong>`,
          'insight', '✓ Transição Epistêmica Validada'
        );
      }

      // FASE 3: O DEVER POLÍTICO/ÉTICO DO RETORNO (KATÁBASIS)
      else if (currentStage === 3) {
        if (lower.includes('ficar') || lower.includes('não deve voltar') || lower.includes('deixa pra lá') || lower.includes('egoísta')) {
          appendTutorMessage(
            `Essa é uma tentação compreensível, mas Platão discorda veementemente! Se o sábio se isola em sua torre de marfim, quem governará a cidade serão os homens ignorantes manipulados por sombras.<br><br>` +
            `Para Platão, a justiça não é privilégio individual: o filósofo tem uma dívida para com a pólis que o formou. <strong>Mesmo sabendo que os prisioneiros podem ridicularizá-lo ou até matá-lo, por que o retorno à caverna (a <em>katábasis</em>) é um dever ético inegociável?</strong>`,
            'refine', '⚠️ Desafio Político'
          );
          return;
        }

        broadcastToProjection(text, 3);
        triggerConfetti();

        appendTutorMessage(
          `🏛️ <strong>Extraordinário, ${escapeHtml(studentName)}! Você atingiu o cume da filosofia platônica!</strong><br><br>` +
          `Você compreendeu a <em>katábasis</em>: a descida do filósofo de volta à escuridão. O verdadeiro sábio não busca o saber para alimentar a vaidade, mas para emancipar a comunidade. Ele desce mesmo sabendo que seus olhos desacostumados às trevas parecerão ridículos aos homens da caverna — e que eles podem até matá-lo, como fizeram com Sócrates em Atenas.<br><br>` +
          `Sua reflexão foi consagrada no telão da aula. Você completou com honras a jornada da <em>Doxa</em> à <em>Episteme</em>!`,
          'insight', '👑 Domínio Filosófico Completo'
        );
      }
    }

    function updateStageUI(title) {
      const badge = document.getElementById('stageBadge');
      badge.textContent = title;
      if (currentStage === 2) {
        badge.style.background = 'rgba(249, 115, 22, 0.2)';
        badge.style.color = '#fdba74';
        badge.style.borderColor = 'rgba(249, 115, 22, 0.4)';
        badge.style.boxShadow = '0 0 15px rgba(249, 115, 22, 0.3)';
      } else if (currentStage === 3) {
        badge.style.background = 'rgba(234, 179, 8, 0.2)';
        badge.style.color = '#fef08a';
        badge.style.borderColor = 'rgba(234, 179, 8, 0.5)';
        badge.style.boxShadow = '0 0 20px rgba(234, 179, 8, 0.4)';
      }
    }

    function broadcastToProjection(insight, stage) {
      const payload = {
        id: studentId,
        nome: studentName,
        stage: stage,
        insight: insight,
        time: new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })
      };

      if (mqttClient && mqttClient.isConnected()) {
        try {
          const msg = new Paho.MQTT.Message(JSON.stringify(payload));
          msg.destinationName = MQTT_TOPIC;
          mqttClient.send(msg);
        } catch (e) {}
      }

      try { channel.postMessage({ type: 'CAVERNA_EVENT', payload: payload }); } catch (e) {}
      try {
        localStorage.setItem('caverna_last_item', JSON.stringify(payload));
        localStorage.setItem('caverna_trigger', Date.now());
      } catch (e) {}
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    // Efeito Confete Visual quando alcança a Luz do Sol
    function triggerConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#f59e0b', '#fde047', '#06b6d4', '#10b981', '#f97316'];
      for (let i = 0; i < 60; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 8 + 4,
          h: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: Math.random() * 4 - 2,
          vy: Math.random() * 3 + 3
        });
      }

      let frames = 0;
      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.w, p.h);
        });
        frames++;
        if (frames < 90) requestAnimationFrame(loop);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      loop();
    }

    window.onload = () => {
      initMqtt();
    };
  </script>
